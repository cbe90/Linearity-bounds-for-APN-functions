status:
  scope: >-
    Formalization of the main results of the article "Linearity bounds for APN functions" by Christof Beierle and Lukas Kölsch. 
    In particular, Theorems 1.1-1.3, Proposition 3.7 and Equation (4.5) in Remark 4.2 of arXiv:2609.35689v2 are formalized. 
    The formalization does not include all of the mathematical statements of the article.
