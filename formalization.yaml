version: "v0.4"

project:
  name: "Linearity bounds for APN functions"
  description: >-
    Lean 4 formalization of linearity bounds for almost perfect
    nonlinear (APN) maps F: 𝔽₂ⁿ → 𝔽₂ⁿ. Write N = 2ⁿ and let L(F)
    denote the maximum Walsh magnitude over components indexed by nonzero
    vectors. For n ≥ 5, the formalization establishes L(F) ≤ N − 6,
    together with L(F) ≤ N − √N/4 − 2 when n is even. For n ≥ 4, ordering the Walsh magnitudes in nonincreasing order as L_k(F) gives
    L_k(F) ≤ (N/√k)√(1 + (2^(k−1) − 1)/N)
    for 1 ≤ k ≤ N(N − 1). In particular, L₂(F) ≤ 2⌊N/3⌋
    and L₄(F) ≤ N/2. Further bounds relate linearity to the count q
    of nonplateaued components with nonzero indices. In odd dimension,
    q > 0 implies L(F)² ≤ N(1 + √(q(N − 1))). In even dimension,
    whenever 1/2 ≤ C < 1, the condition
    q ≤ (4C − C² − 1)N/4 + 1 implies L(F) ≤ CN.
    Additional results sharpen the upper bound on the linearity in certain odd dimensions and
    constrain the second-largest Walsh magnitude when the linearity is
    close to N.
  authors: ["Christof Beierle", "Lukas Kölsch"]
  responsible_maintainers: ["Christof Beierle", "Lukas Kölsch"]
  license: "Apache-2.0"

